name: Validate Godot project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  godot-check:
    name: Import, parse and launch Godot project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 Standard
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Print Godot version
        run: godot --version

      - name: Import resources and validate scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-editor.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-editor.log; then
            echo "Godot reported script or resource errors."
            exit 1
          fi

      - name: Run Object System smoke tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_system_smoke.gd 2>&1 | tee object-system-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-system-test.log; then
            echo "Object System smoke tests reported an error."
            exit 1
          fi

      - name: Launch main scene and check runtime
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee godot-runtime.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-runtime.log; then
            echo "Godot reported runtime errors."
            exit 1
          fi
