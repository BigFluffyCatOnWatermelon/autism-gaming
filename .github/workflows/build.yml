name: Validate Godot project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  godot-check:
    name: Import and launch Godot project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 Standard
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Print Godot version
        run: godot --version

      - name: Import resources and parse project
        run: godot --headless --editor --path . --quit

      - name: Launch main scene briefly
        run: godot --headless --path . --quit-after 5
