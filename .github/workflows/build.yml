name: Validate Godot project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  godot-check:
    name: Import, parse and launch Godot project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 Standard
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Print Godot version
        run: godot --version

      - name: Load editor plugins, import resources and validate scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-editor.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-editor.log; then
            echo "Godot reported script or resource errors."
            exit 1
          fi

      - name: Run Object System smoke tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_system_smoke.gd 2>&1 | tee object-system-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-system-test.log; then
            echo "Object System smoke tests reported an error."
            exit 1
          fi

      - name: Run Object Builder UI factory smoke tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_ui_factory_smoke.gd 2>&1 | tee object-builder-ui-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-ui-test.log; then
            echo "Object Builder UI factory smoke tests reported an error."
            exit 1
          fi

      - name: Run Object Builder view component tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_views_smoke.gd 2>&1 | tee object-builder-views-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-views-test.log; then
            echo "Object Builder view component tests reported an error."
            exit 1
          fi

      - name: Run Object Builder workspace view tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_workspace_view_smoke.gd 2>&1 | tee object-builder-workspace-view-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-workspace-view-test.log; then
            echo "Object Builder workspace view tests reported an error."
            exit 1
          fi

      - name: Run Object Builder capability settings view tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_capability_settings_view_smoke.gd 2>&1 | tee object-builder-capability-settings-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-capability-settings-test.log; then
            echo "Object Builder capability settings view tests reported an error."
            exit 1
          fi

      - name: Run Object Builder capability list view tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_capability_list_view_smoke.gd 2>&1 | tee object-builder-capability-list-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-capability-list-test.log; then
            echo "Object Builder capability list view tests reported an error."
            exit 1
          fi

      - name: Run Object Builder component editor view tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_component_editor_view_smoke.gd 2>&1 | tee object-builder-component-editor-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-component-editor-test.log; then
            echo "Object Builder component editor view tests reported an error."
            exit 1
          fi

      - name: Run Object Builder scene tree view tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_scene_tree_view_smoke.gd 2>&1 | tee object-builder-scene-tree-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-scene-tree-test.log; then
            echo "Object Builder scene tree view tests reported an error."
            exit 1
          fi

      - name: Run Object Builder visual editor view tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_visual_editor_view_smoke.gd 2>&1 | tee object-builder-visual-editor-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-visual-editor-test.log; then
            echo "Object Builder visual editor view tests reported an error."
            exit 1
          fi

      - name: Run Object Builder dialog view tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_dialog_view_smoke.gd 2>&1 | tee object-builder-dialog-view-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-dialog-view-test.log; then
            echo "Object Builder dialog view tests reported an error."
            exit 1
          fi

      - name: Run Object Builder library controller tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_library_controller_smoke.gd 2>&1 | tee object-builder-library-controller-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-library-controller-test.log; then
            echo "Object Builder library controller tests reported an error."
            exit 1
          fi

      - name: Run Object Builder editor session tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_editor_session_smoke.gd 2>&1 | tee object-builder-editor-session-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-editor-session-test.log; then
            echo "Object Builder editor session tests reported an error."
            exit 1
          fi

      - name: Run Object Builder scene draft service tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_scene_draft_service_smoke.gd 2>&1 | tee object-builder-scene-draft-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-scene-draft-test.log; then
            echo "Object Builder scene draft service tests reported an error."
            exit 1
          fi

      - name: Run Object Builder property list view tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_property_list_view_smoke.gd 2>&1 | tee object-builder-property-list-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-builder-property-list-test.log; then
            echo "Object Builder property list view tests reported an error."
            exit 1
          fi

      - name: Run Object Property Value Codec smoke tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_property_value_codec_smoke.gd 2>&1 | tee object-property-codec-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' object-property-codec-test.log; then
            echo "Object Property Value Codec smoke tests reported an error."
            exit 1
          fi

      - name: Run standalone mechanic module smoke tests
        shell: bash
        run: |
          set -euo pipefail
          found_test=false
          for test_script in addons/object_builder/mechanics/*/tests/smoke.gd; do
            [[ -f "$test_script" ]] || continue
            found_test=true
            echo "Running $test_script"
            godot --headless --path . --script "res://$test_script"
          done
          if [[ "$found_test" != true ]]; then
            echo "No standalone mechanic module smoke tests were found."
            exit 1
          fi

      - name: Launch main scene and check runtime
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee godot-runtime.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-runtime.log; then
            echo "Godot reported runtime errors."
            exit 1
          fi
