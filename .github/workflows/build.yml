name: Validate Godot project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep the newest validation run for each branch; obsolete queued runs add noise
# and delay feedback without providing useful coverage.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-check:
    name: Import, parse and launch Godot project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 Standard
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Print Godot version
        run: godot --version

      - name: Load editor plugins, import resources and validate scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-editor.log
          errors="$(grep -E 'SCRIPT ERROR:|ERROR:' godot-editor.log | grep -v 'RID allocations of type .* were leaked at exit' || true)"
          if [[ -n "$errors" ]]; then
            echo "$errors"
            echo "Godot reported script or resource errors."
            exit 1
          fi

      - name: Run Object System smoke tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_system_smoke.gd 2>&1 | tee object-system-test.log
          errors="$(grep -E 'SCRIPT ERROR:|ERROR:' object-system-test.log | grep -v 'RID allocations of type .* were leaked at exit' || true)"
          if [[ -n "$errors" ]]; then
            echo "$errors"
            echo "Object System smoke tests reported an error."
            exit 1
          fi

      - name: Run standalone mechanic module smoke tests
        shell: bash
        run: |
          set -euo pipefail
          found_test=false
          for test_script in addons/object_builder/mechanics/*/tests/smoke.gd; do
            [[ -f "$test_script" ]] || continue
            found_test=true
            echo "Running $test_script"
            godot --headless --path . --script "res://$test_script"
          done
          if [[ "$found_test" != true ]]; then
            echo "No standalone mechanic module smoke tests were found."
            exit 1
          fi

      - name: Run Object Builder capability metadata smoke tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/object_builder_capability_metadata_smoke.gd 2>&1 | tee object-builder-capability-metadata-test.log
          errors="$(grep -E 'SCRIPT ERROR:|ERROR:' object-builder-capability-metadata-test.log | grep -v 'RID allocations of type .* were leaked at exit' || true)"
          if [[ -n "$errors" ]]; then
            echo "$errors"
            echo "Object Builder capability metadata tests reported an error."
            exit 1
