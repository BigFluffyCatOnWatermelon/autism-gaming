<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Autism Gaming — экспериментальная браузерная 2D-игра."
    />
    <meta name="theme-color" content="#0b1020" />
    <title>Autism Gaming</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Autism Gaming — главная">
          <span class="brand-mark">A</span>
          <span>autism gaming</span>
        </a>
        <span class="build-label">BROWSER BUILD · 0.1.0</span>
      </header>

      <main class="workspace">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">DEVELOPMENT WORKSPACE</p>
          <h1 id="page-title">Техническая площадка</h1>
          <p class="intro-copy">
            Проверяем, что игровой движок, отрисовка и управление работают в браузере.
          </p>
        </section>

        <section class="game-frame" aria-label="Игровое окно">
          <div id="game"></div>
        </section>

        <footer class="controls">
          <div class="control-hint">
            <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
            <span class="or">или</span>
            <span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span>
            <span class="hint-text">движение</span>
          </div>
          <span class="status"><span class="status-dot"></span> Движок запущен</span>
        </footer>
      </main>

      <div class="bottom-note">Проект ещё без выбранного жанра — это тестовая сцена, а не финальный дизайн.</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
